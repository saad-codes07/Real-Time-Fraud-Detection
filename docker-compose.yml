services:
  mlflow:
    build:
      context: ./mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/version')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data:ro
    environment:
      API_URL: http://api:8000
      DEMO_CSV: /data/demo_transactions.csv
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Training is a one-off job, not a server, so it only runs when you ask.
  trainer:
    build:
      context: .
      dockerfile: model_training/Dockerfile
    profiles: ["train"]
    volumes:
      - ./data:/data:ro
      - ./models:/models
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow_data: